# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://shaunnez.github.io/OperationOtter/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # A time-travel build (test-mode pill, ?now=) is also published at /OperationOtter/test/
  # so you can check each day on your phone. Set this to 'false' before she gets the link.
  TEST_BUILD: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - name: Build the real site
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build the test-mode copy
        if: env.TEST_BUILD == 'true'
        run: npx vite build --mode preview --outDir dist/test --emptyOutDir
        env:
          BASE_PATH: /${{ github.event.repository.name }}/test/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
